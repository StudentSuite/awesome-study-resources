name: Markdown Lint

on:
  pull_request:
    paths:
      - "**/*.md"
      - .github/workflows/markdownlint.yml
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - .github/workflows/markdownlint.yml

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            README.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            CHANGELOG.md
            CONTRIBUTORS.md
            SECURITY.md
            .github/PULL_REQUEST_TEMPLATE.md
