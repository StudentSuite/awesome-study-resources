name: Markdown Lint

on:
  # No `paths:` filter here: main's branch protection requires this check, and a
  # path-skipped workflow never reports a status, which blocks the merge button.
  pull_request:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - .github/workflows/markdownlint.yml

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            README.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            CHANGELOG.md
            CONTRIBUTORS.md
            SECURITY.md
            .github/PULL_REQUEST_TEMPLATE.md
