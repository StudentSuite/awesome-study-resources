name: Dead Link Check

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress README.md CONTRIBUTING.md CODE_OF_CONDUCT.md CHANGELOG.md CONTRIBUTORS.md SECURITY.md .github/PULL_REQUEST_TEMPLATE.md
          format: markdown
          output: lychee-report.md
          fail: false

      - name: Find existing open "Dead link check failed" issue
        id: existing
        if: always()
        run: |
          number=$(gh issue list --search "Dead link check failed in:title" --state open --json number --jq '.[0].number // ""')
          echo "number=$number" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update existing issue with the latest report
        if: steps.lychee.outputs.exit_code != 0 && steps.existing.outputs.number != ''
        run: gh issue comment "${{ steps.existing.outputs.number }}" --body-file lychee-report.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Open a new issue only if none is already open
        if: steps.lychee.outputs.exit_code != 0 && steps.existing.outputs.number == ''
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Dead link check failed
          content-filepath: lychee-report.md
          labels: bug,quality

      - name: Close the existing issue now that links are healthy
        if: steps.lychee.outputs.exit_code == 0 && steps.existing.outputs.number != ''
        run: gh issue close "${{ steps.existing.outputs.number }}" --comment "Latest scheduled run found no broken links. Closing."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fail the job if links are broken
        if: steps.lychee.outputs.exit_code != 0
        run: exit 1
